[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-room"
version = "0.3.0"
description = "A local web chat and MCP bridge for humans and their coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cjdew"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/cjdew/local-agent-room"
Issues = "https://github.com/cjdew/local-agent-room/issues"

[project.scripts]
local-agent-room = "local_agent_room.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_agent_room = ["static/*"]
